<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary SEO Meta Tags -->
    <title>BookFlow — Premier Online Bookstore & Digital SaaS Commerce</title>
    <meta name="title" content="BookFlow — Premier Online Bookstore & Digital SaaS Commerce" />
    <meta name="description" content="Discover thousands of bestsellers, self-help, business, fiction, and tech literature on BookFlow. Real-time shopping, 1-click fulfillment, order tracking, and intelligent seller SaaS management." />
    <meta name="keywords" content="books, bookstore, online bookstore, bestsellers, atomic habits, self help books, business books, buy books online, digital reading, SaaS book commerce, bookflow" />
    <meta name="author" content="BookFlow Commerce Inc." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B0F19" />

    <!-- Canonical Link -->
    <link rel="canonical" href="https://bookflow-saas.com/" />

    <!-- Open Graph / Facebook / WhatsApp SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bookflow-saas.com/" />
    <meta property="og:title" content="BookFlow — Premier Online Bookstore & Digital SaaS Commerce" />
    <meta property="og:description" content="Discover thousands of curated bestsellers, seamless cart checkout, real-time order tracking, and integrated SaaS seller operations." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&q=80&w=1200" />
    <meta property="og:site_name" content="BookFlow" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bookflow-saas.com/" />
    <meta name="twitter:title" content="BookFlow — Premier Online Bookstore & Digital SaaS Commerce" />
    <meta name="twitter:description" content="Discover thousands of curated bestsellers, seamless cart checkout, real-time order tracking, and integrated SaaS seller operations." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&q=80&w=1200" />

    <!-- Schema.org JSON-LD Structured Data for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "BookStore",
          "@id": "https://bookflow-saas.com/#organization",
          "name": "BookFlow",
          "url": "https://bookflow-saas.com",
          "logo": "https://bookflow-saas.com/images/books/book-bk001.svg",
          "description": "Premier modern online bookstore and connected SaaS commerce platform offering bestsellers, literature, and management solutions.",
          "priceRange": "₹₹",
          "currenciesAccepted": "INR",
          "paymentAccepted": "Credit Card, Debit Card, UPI, Net Banking",
          "openingHours": "Mo-Su 00:00-24:00"
        },
        {
          "@type": "WebSite",
          "@id": "https://bookflow-saas.com/#website",
          "url": "https://bookflow-saas.com",
          "name": "BookFlow",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://bookflow-saas.com/books?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Google Web Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-surface text-secondary-900 font-sans antialiased selection:bg-amber-100 selection:text-amber-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
