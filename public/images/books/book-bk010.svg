<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" rx="14" fill="url(#grad)" />
  <rect x="18" y="18" width="364" height="564" rx="10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  <rect x="28" y="28" width="344" height="544" rx="8" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <!-- Spine Shadow -->
  <rect x="0" y="0" width="30" height="600" fill="rgba(0,0,0,0.3)" />
  <!-- Badge -->
  <rect x="50" y="60" width="110" height="26" rx="13" fill="rgba(255,255,255,0.18)" />
  <text x="105" y="77" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BESTSELLER</text>
  <!-- Content -->
  <g transform="translate(50, 200)">
    <text x="0" y="0" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="bold">Sapiens: A Brief History</text>
    <text x="0" y="45" fill="rgba(255,255,255,0.85)" font-family="sans-serif" font-size="16">by Yuval Noah Harari</text>
    <line x1="0" y1="80" x2="80" y2="80" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  </g>
  <!-- Bottom branding -->
  <g transform="translate(50, 530)">
    <text x="0" y="0" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="12" letter-spacing="2">BOOKFLOW EDITIONS</text>
  </g>
</svg>